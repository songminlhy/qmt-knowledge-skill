name: QMT Security Regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'security/**'

permissions:
  contents: read

concurrency:
  group: qmt-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-regression:
    name: Security regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        # actions/checkout v7.0.1 — full SHA pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show Python runtime
        run: python3 --version

      - name: Debug scanner SHA256
        run: |
          python3 -c "
          import hashlib, json
          actual = hashlib.sha256(open('scripts/qmt_semantic_scan.py','rb').read()).hexdigest()
          base = json.load(open('scripts/security-baseline.json'))['scanner_sha256']
          print(f'Scanner SHA256 (actual):   {actual}')
          print(f'Scanner SHA256 (baseline): {base}')
          print(f'Match: {actual == base}')
          import subprocess
          subprocess.run(['xxd','-l','80','scripts/qmt_semantic_scan.py'])
          "

      - name: Scanner self-test
        run: python3 scripts/qmt_semantic_scan.py --self-test

      - name: Security regression gate
        run: python3 scripts/security_check.py
